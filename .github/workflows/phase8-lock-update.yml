name: Phase 8 temporary lockfile update

on:
  push:
    branches: [feature/control-financiero-v2]
    paths: [.github/workflows/phase8-lock-update.yml]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/control-financiero-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Regenerate exact npm lockfile from patched dependencies
        working-directory: control-financiero-firebase
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and dependency override
        working-directory: control-financiero-firebase
        run: |
          npm ci --no-audit --no-fund
          npm ls @grpc/grpc-js
          node -e "const p=require('./package-lock.json');const a=Object.entries(p.packages).filter(([k])=>k.endsWith('/@grpc/grpc-js'));if(!a.length||a.some(([k,v])=>v.version!=='1.14.7')){console.error(a);process.exit(1)}console.log('gRPC 1.14.7 en todas las rutas')"
      - name: Run regression tests and production compilation
        working-directory: control-financiero-firebase
        run: |
          npm test
          npm run build
          npm run test:pwa-build
      - name: Review remaining production advisories
        working-directory: control-financiero-firebase
        run: npm audit --omit=dev --audit-level=moderate || true
      - name: Commit refreshed lockfile to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-financiero-firebase/package-lock.json
          if git diff --cached --quiet; then echo 'Lockfile already current'; exit 0; fi
          git commit -m 'security(lock): resolve patched grpc and Vite 6 dependencies'
          git push origin HEAD:refs/heads/feature/control-financiero-v2
