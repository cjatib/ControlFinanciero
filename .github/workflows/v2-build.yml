name: V2 build validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/control-financiero-v2]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-financiero-firebase
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: control-financiero-firebase/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
